# Jenkins Configuration as Code (JCasC).
# All ${VARS} are resolved from jenkins/.env at container start — fill placeholders there.
jenkins:
  systemMessage: "Developer Command Center — CI/CD (placeholder config; edit jenkins/.env)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          # Docker Hub — used by the Build & Push stage (docker login).
          - usernamePassword:
              scope: GLOBAL
              id: "dockerhub-credentials"
              description: "Docker Hub username + access token"
              username: "${DOCKERHUB_USER}"
              password: "${DOCKERHUB_TOKEN}"
          # GitHub — used by the multibranch source to scan the repo.
          - usernamePassword:
              scope: GLOBAL
              id: "github-token"
              description: "GitHub username + PAT (branch source scanning)"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"
          # kubeconfig — used by the Deploy stage (kubectl). Secret FILE credential.
          # secretBytes is base64 of ~/.kube/config  (see jenkins/.env.example).
          - file:
              scope: GLOBAL
              id: "kubeconfig"
              description: "kubeconfig for kubectl rollout"
              fileName: "kubeconfig"
              secretBytes: "${KUBECONFIG_B64}"

unclassified:
  location:
    url: "http://localhost:8081/"

# Seed a multibranch pipeline pointing at your repo (placeholder owner/repo).
jobs:
  - script: >
      multibranchPipelineJob('developer-command-center') {
        displayName('Developer Command Center')
        branchSources {
          branchSource {
            source {
              github {
                id('dcc-github')
                repoOwner('PLACEHOLDER_GITHUB_OWNER')
                repository('PLACEHOLDER_GITHUB_REPO')
                credentialsId('github-token')
                configuredByUrl(false)
              }
            }
          }
        }
        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
        orphanedItemStrategy {
          discardOldItems { numToKeep(10) }
        }
      }
