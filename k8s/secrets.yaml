# TEMPLATE ONLY — replace PLACEHOLDER_* with real values before applying.
# Never commit real secrets. Apply with:  kubectl apply -f k8s/secrets.yaml
# Or create imperatively:
#   kubectl create secret generic dcc-secret -n microservices \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=GITHUB_TOKEN=ghp_... \
#     --from-literal=RABBITMQ_PASSWORD=guest \
#     --from-literal=GITHUB_DB_PASSWORD=change-me \
#     --from-literal=REVIEWS_DB_PASSWORD=change-me
apiVersion: v1
kind: Secret
metadata:
  name: dcc-secret
  namespace: microservices
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "PLACEHOLDER_ANTHROPIC_API_KEY"
  GITHUB_TOKEN: "PLACEHOLDER_GITHUB_TOKEN"
  RABBITMQ_PASSWORD: "guest"
  GITHUB_DB_PASSWORD: "PLACEHOLDER_GITHUB_DB_PASSWORD"
  REVIEWS_DB_PASSWORD: "PLACEHOLDER_REVIEWS_DB_PASSWORD"
