# PostgreSQL for github-service (StatefulSet + headless Service + PVC)
apiVersion: v1
kind: Service
metadata:
  name: github-db
  namespace: microservices
spec:
  clusterIP: None
  selector:
    app: github-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: github-db
  namespace: microservices
spec:
  serviceName: github-db
  replicas: 1
  selector:
    matchLabels:
      app: github-db
  template:
    metadata:
      labels:
        app: github-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "github"
            - name: POSTGRES_USER
              value: "github"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dcc-secret
                  key: GITHUB_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "github", "-d", "github"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "github", "-d", "github"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
