# API Gateway for local Docker Compose.
# Serves the dashboard (static) at /  AND routes /api/<svc>/* to each service.
# Same origin for UI + API => no CORS. Mirrors the Traefik IngressRoute in K8s.
worker_processes  1;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Docker's embedded DNS; resolve service names at request time so the
    # gateway starts even if a backend is briefly down (self-healing demo).
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location /api/github/ {
            set $svc "http://github-service:8000";
            rewrite ^/api/github/(.*)$ /$1 break;
            proxy_pass $svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/rag/ {
            set $svc "http://rag-context-service:8000";
            rewrite ^/api/rag/(.*)$ /$1 break;
            proxy_pass $svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/reviews/ {
            set $svc "http://ai-review-service:8000";
            rewrite ^/api/reviews/(.*)$ /$1 break;
            proxy_pass $svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/notify/ {
            set $svc "http://notification-service:8000";
            rewrite ^/api/notify/(.*)$ /$1 break;
            proxy_pass $svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Dashboard (single-page) — everything else serves static files.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
